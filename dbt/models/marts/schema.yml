version: 2

models:
  - name: dim_repos
    columns:
      - name: repo_id
        tests: [not_null, unique]

  - name: dim_dates
    # Registers this as MetricFlow's time spine — required by the semantic
    # layer for any time-based metric (which is all of them here), even
    # though dim_dates is also used as an ordinary dimension table.
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        granularity: day
        tests: [not_null, unique]

  - name: fct_commits
    columns:
      - name: commit_sha
        tests: [not_null, unique]
      - name: committed_at
        tests: [not_null]

  - name: fct_pull_requests
    columns:
      - name: pr_id
        tests: [not_null, unique]

  - name: fct_issues
    columns:
      - name: issue_id
        tests: [not_null, unique]
