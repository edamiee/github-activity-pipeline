name: Ingest and transform

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
  workflow_dispatch: {} # manual trigger from the Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Named PIPELINE_GITHUB_TOKEN rather than GITHUB_TOKEN — that name is
      # reserved for the token GitHub Actions injects automatically for the
      # runner itself, and shadowing it causes confusing auth failures.
      GITHUB_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
      # Same reservation applies to variables starting with GITHUB_ — the
      # repo variable is named INGEST_GITHUB_USERNAME for that reason, and
      # only renamed to GITHUB_USERNAME here for ingest.py to read.
      GITHUB_USERNAME: ${{ vars.INGEST_GITHUB_USERNAME }}
      PGHOST: ${{ vars.PGHOST }}
      PGUSER: ${{ vars.PGUSER }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
      PGDATABASE: ${{ vars.PGDATABASE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ingestion dependencies
        run: pip install -r ingest/requirements.txt

      - name: Run ingestion
        run: python ingest/ingest.py

      - name: Install dbt
        run: pip install dbt-postgres

      - name: Configure dbt profile
        run: |
          mkdir -p ~/.dbt
          cp dbt/profiles_example.yml ~/.dbt/profiles.yml

      - name: dbt run
        working-directory: dbt
        run: dbt run

      - name: dbt test
        working-directory: dbt
        run: dbt test

      - name: Notify on failure
        # Same Telegram bot/chat damienkedwardstech.com pings for business
        # inquiries — a failed run here sits unattended for up to 6h
        # otherwise, since nothing else watches this workflow.
        if: failure()
        run: |
          curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "content-type: application/json" \
            -d "$(python3 -c '
import json, os
text = (
    f"github-activity-pipeline run failed: {os.environ[\"REPO\"]}\n"
    f"{os.environ[\"RUN_URL\"]}"
)
print(json.dumps({"chat_id": os.environ["TELEGRAM_ADMIN_CHAT_ID"], "text": text}))
')"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
