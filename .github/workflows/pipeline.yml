name: Ingest and transform

on:
  schedule:
    - cron: "0 6 * * *" # daily, 06:00 UTC
  workflow_dispatch: {} # manual trigger from the Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Named PIPELINE_GITHUB_TOKEN rather than GITHUB_TOKEN — that name is
      # reserved for the token GitHub Actions injects automatically for the
      # runner itself, and shadowing it causes confusing auth failures.
      GITHUB_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
      # Same reservation applies to variables starting with GITHUB_ — the
      # repo variable is named INGEST_GITHUB_USERNAME for that reason, and
      # only renamed to GITHUB_USERNAME here for ingest.py to read.
      GITHUB_USERNAME: ${{ vars.INGEST_GITHUB_USERNAME }}
      PGHOST: ${{ vars.PGHOST }}
      PGUSER: ${{ vars.PGUSER }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
      PGDATABASE: ${{ vars.PGDATABASE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ingestion dependencies
        run: pip install -r ingest/requirements.txt

      - name: Run ingestion
        run: python ingest/ingest.py

      - name: Install dbt
        run: pip install dbt-postgres

      - name: Configure dbt profile
        run: |
          mkdir -p ~/.dbt
          cp dbt/profiles_example.yml ~/.dbt/profiles.yml

      - name: dbt deps
        working-directory: dbt
        run: dbt deps

      - name: dbt run
        working-directory: dbt
        run: dbt run

      - name: dbt test
        working-directory: dbt
        run: dbt test
